[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestkit"
dynamic = ["version"]
description = "Resumable bulk-dataset harvesting engine (checkpoint/dedup/paginate/throttle) for LeMetadatarr source clients."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.10",
]

[project.optional-dependencies]
# datasets carries an fsspec ceiling. With no floor, a sibling dependency that
# wants a newer fsspec is satisfied by walking datasets backwards instead, and
# nothing says so: the probe fsspec<2023.1 takes this extra to datasets 2.14.4
# and huggingface-hub 0.17.3. With the floor the same input is unsatisfiable and
# the resolver names the conflict, which is the better failure.
hf = ["datasets>=4", "huggingface_hub", "pyarrow"]
stealth = ["unblock_requests"]
test = ["pytest"]

[project.scripts]
harvestkit = "harvestkit.__main__:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/harvestkit"

[tool.setuptools.packages.find]
include = ["harvestkit*"]

[tool.setuptools.dynamic]
version = {attr = "harvestkit.version.__version__"}
