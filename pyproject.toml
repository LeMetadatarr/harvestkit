[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestkit"
version = "0.1.0a1"
description = "Resumable bulk-dataset harvesting engine (checkpoint/dedup/paginate/throttle) for LeMetadatarr source clients."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.10",
]

[project.optional-dependencies]
hf = ["datasets", "huggingface_hub", "pyarrow"]
stealth = ["unblock_requests"]
test = ["pytest"]

[project.scripts]
harvestkit = "harvestkit.__main__:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/harvestkit"

[tool.setuptools.packages.find]
include = ["harvestkit*"]
